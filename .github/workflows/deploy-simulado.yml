name: Publicar simulado no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "simulado-sistemas-operacionais/**"
      - ".github/workflows/deploy-simulado.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: simulado-sistemas-operacionais

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
